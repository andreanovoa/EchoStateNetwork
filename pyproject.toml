[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echostatenetwork"
version = "0.1.1"
description = "Echo state networks / reservoir computing in pure numpy: ridge training, recycle validation, ragged segments, parametric inputs, Bayesian hyperparameter search"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Andrea Nóvoa", email = "a.novoa@imperial.ac.uk"}
]
keywords = ["echo-state-network", "reservoir-computing", "time-series", "recurrent-network"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "matplotlib>=3.9,<4.0",
    "numpy>=2.0,<3.0",
    "scipy>=1.13,<2.0",
]

[project.optional-dependencies]
opt = ["scikit-optimize>=0.9"]
dev = ["pytest>=8.4", "ruff", "scikit-optimize>=0.9"]

[project.urls]
Homepage = "https://github.com/andreanovoa/EchoStateNetwork"
Repository = "https://github.com/andreanovoa/EchoStateNetwork"
Issues = "https://github.com/andreanovoa/EchoStateNetwork/issues"

[tool.setuptools]
packages = ["echostatenetwork"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP"]
ignore = [
    "E501",  # line too long (handled by formatter)
    "E741",  # ambiguous names: l is segment-index notation here
    "N802", "N803", "N806", "N815",  # ESN notation: N_units, Wout, W, Win, dt_ESN, ...
    "N817",  # GaussianProcessRegressor as GPR
]
