site_name: echostatenetwork
site_description: Echo state networks / reservoir computing in pure numpy
site_url: https://andreanovoa.github.io/EchoStateNetwork/
repo_url: https://github.com/andreanovoa/EchoStateNetwork
repo_name: andreanovoa/EchoStateNetwork

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: auto
            show_source: true
            members_order: source
            show_root_heading: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - API reference: api/esn.md
  - Tutorial notebooks:
      - EchoStateNetwork class: https://github.com/andreanovoa/EchoStateNetwork/blob/master/tutorials/01_echo_state_network.ipynb
      - Parametric ESN: https://github.com/andreanovoa/EchoStateNetwork/blob/master/tutorials/02_parametric_esn.ipynb
